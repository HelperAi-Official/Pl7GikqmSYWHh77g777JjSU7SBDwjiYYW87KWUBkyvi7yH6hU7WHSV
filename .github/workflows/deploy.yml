name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # Cambia a 'master' si tu rama principal se llama así

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # <-- Esto otorga los permisos necesarios automáticamente
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject API Key securely
        run: |
          # Reemplaza INJECTED_BY_GITHUB_ACTIONS por el secreto real de forma segura
          sed -i 's|INJECTED_BY_GITHUB_ACTIONS|${{ secrets.GROQ_API_KEY }}|g' config.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          commit_message: "Auto-update config with API key [skip ci]"
