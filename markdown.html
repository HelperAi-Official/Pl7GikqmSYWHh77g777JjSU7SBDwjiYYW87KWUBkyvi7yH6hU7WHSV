<!-- markdown.html -->
<script>
    // Tu propio motor de Markdown casero optimizado y completo
    function renderMarkdown(text) {
        if (!text) return "";

        // 1. Escapar HTML básico para seguridad
        let html = text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");

        // 2. Bloques de código (```lenguaje ... ```)
        html = html.replace(/```([a-zA-Z]*)\n([\s\S]*?)```/g, (match, lang, code) => {
            let language = lang ? lang.toUpperCase() : 'CODE';
            return `
            <div class="code-block-wrapper">
                <div class="code-header">
                    <span>[${language}]</span>
                    <button class="copy-btn" onclick="copyCode(this)">Copiar</button>
                </div>
                <pre><code>${code.trim()}</code></pre>
            </div>`;
        });

        // 3. Tablas básicas (| col | col |)
        html = html.replace(/\|(.+)\|/g, (match, content) => {
            let cells = content.split('|').map(c => `<td>${c.trim()}</td>`).join('');
            return `<tr>${cells}</tr>`;
        });
        html = html.replace(/(<tr>[\s\S]*?<\/tr>)+/g, '<table style="width:100%; border-collapse:collapse; margin:0.8rem 0;">$&</table>');

        // 4. Encabezados (#, ##, ###)
        html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
        html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
        html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');

        // 5. Blockquotes (> texto) -> Se usa &gt; por el escape inicial de seguridad
        html = html.replace(/^&gt; (.*$)/gim, '<blockquote>$1</blockquote>');

        // 6. Listas desordenadas (- o *)
        html = html.replace(/^[-\*] (.*$)/gim, '<ul><li>$1</li></ul>');
        html = html.replace(/<\/ul>\s*<ul>/g, '');

        // 7. Listas ordenadas (1., 2., etc.)
        html = html.replace(/^\d+\.\s+(.*$)/gim, '<ol><li>$1</li></ol>');
        html = html.replace(/<\/ol>\s*<ol>/g, '');

        // 8. Enlaces ([Texto](URL))
        html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" style="color: #f97316; text-decoration: underline;">$1</a>');

        // 9. Negritas (**texto**)
        html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

        // 10. Cursivas (*texto*)
        html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');

        // 11. Tachado (~~texto~~)
        html = html.replace(/~~([^~]+)~~/g, '<del>$1</del>');

        // 12. Código en línea (`código`)
        html = html.replace(/`([^`]+)`/g, '<code style="background: #2d2d30; padding: 2px 5px; border-radius: 4px; font-family: monospace;">$1</code>');

        // 13. Saltos de línea limpios
        html = html.replace(/\r\n/g, '\n');
        html = html.replace(/\n/g, '<br>');

        // Limpieza de etiquetas <br> sobrantes alrededor de bloques estructurales para evitar errores visuales
        html = html.replace(/<\/div><br>/g, '</div>');
        html = html.replace(/<\/blockquote><br>/g, '</blockquote>');
        html = html.replace(/<\/ul><br>/g, '</ul>');
        html = html.replace(/<\/ol><br>/g, '</ol>');
        html = html.replace(/<\/table><br>/g, '</table>');
        html = html.replace(/<\/h[1-3]><br>/g, (match) => match.replace('<br>', ''));

        return html;
    }

    // Función para el botón Copiar
    function copyCode(button) {
        const wrapper = button.closest('.code-block-wrapper');
        const codeText = wrapper.querySelector('code').innerText;

        navigator.clipboard.writeText(codeText).then(() => {
            button.textContent = '¡Copiado!';
            setTimeout(() => {
                button.textContent = 'Copiar';
            }, 2000);
        });
    }
</script>
