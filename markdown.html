<!-- markdown.html -->
<script>
    // Motor de Markdown definitivo corregido para listas, enlaces y estilos
    function renderMarkdown(text) {
        if (!text) return "";

        // 1. Escapar HTML básico por seguridad
        let html = text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");

        // 2. Bloques de código (```lenguaje ... ```)
        html = html.replace(/```([a-zA-Z]*)\n([\s\S]*?)```/g, (match, lang, code) => {
            let language = lang ? lang.toUpperCase() : 'CODE';
            return `
            <div class="code-block-wrapper">
                <div class="code-header">
                    <span>[${language}]</span>
                    <button class="copy-btn" onclick="copyCode(this)">Copiar</button>
                </div>
                <pre><code>${code.trim()}</code></pre>
            </div>`;
        });

        // 3. Tablas Markdown
        html = html.replace(/\|(.+)\|\n\|([-\s|:]+)\\|\n([\s\S]*?)(\n\n|$)/g, (match, headerRow, sepRow, bodyRows) => {
            let headers = headerRow.split('|').filter(c => c.trim() !== '').map(c => `<th>${c.trim()}</th>`).join('');
            let rows = bodyRows.trim().split('\n').map(row => {
                let cells = row.split('|').filter(c => c.trim() !== '').map(c => `<td>${c.trim()}</td>`).join('');
                return `<tr>${cells}</tr>`;
            }).join('');
            return `<table style="width:100%; border-collapse:collapse; margin:0.8rem 0; border: 1px solid #2f2f32;">
                <thead><tr style="background: #252528;">${headers}</tr></thead>
                <tbody>${rows}</tbody>
            </table>`;
        });

        // 4. Encabezados (####, ###, ##, #)
        html = html.replace(/^#### (.*$)/gim, '<h4>$1</h4>');
        html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
        html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
        html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');

        // 5. Blockquotes (> texto)
        html = html.replace(/^&gt; (.*$)/gim, '<blockquote>$1</blockquote>');

        // 6. Listas desordenadas con - o * (Procesadas ANTES de las cursivas para evitar conflictos)
        html = html.replace(/^[-\*]\s+(.*$)/gim, '<li>$1</li>');
        html = html.replace(/(<li>[\s\S]*?<\/li>)+/g, '<ul style="margin-left: 1.2rem; margin-bottom: 0.6rem;">$&</ul>');

        // 7. Listas ordenadas (1., 2., etc.)
        html = html.replace(/^\d+\.\s+(.*$)/gim, '<li>$1</li>');
        html = html.replace(/(<li>[\s\S]*?<\/li>)+/g, (match) => {
            // Evitar duplicar ol si ya es una lista desordenada
            if (match.includes('<ul>')) return match;
            return `<ol style="margin-left: 1.2rem; margin-bottom: 0.6rem;">${match}</ol>`;
        });

        // 8. Enlaces ([Texto](URL)) - Soporta saltos de línea intermedios
        html = html.replace(/\[([^\]]+)\]\s*\(([^)]+)\)/g, '<a href="$2" target="_blank" style="color: #f97316; text-decoration: underline;">$1</a>');

        // 9. Negritas (***texto*** o **texto**)
        html = html.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
        html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

        // 10. Cursivas (*texto* o _texto_)
        html = html.replace(/(^|[^\\*])\*([^*]+)\*/g, '$1<em>$2</em>');

        // 11. Tachado (~~texto~~)
        html = html.replace(/~~([^~]+)~~/g, '<del>$1</del>');

        // 12. Código en línea (`código`)
        html = html.replace(/`([^`]+)`/g, '<code style="background: #2d2d30; padding: 2px 5px; border-radius: 4px; font-family: monospace; color: #ffab70;">$1</code>');

        // 13. Saltos de línea limpios
        html = html.replace(/\r\n/g, '\n');
        html = html.replace(/\n/g, '<br>');

        // Limpieza de etiquetas <br> sobrantes tras bloques estructurales
        html = html.replace(/<\/div><br>/g, '</div>');
        html = html.replace(/<\/blockquote><br>/g, '</blockquote>');
        html = html.replace(/<\/ul><br>/g, '</ul>');
        html = html.replace(/<\/ol><br>/g, '</ol>');
        html = html.replace(/<\/table><br>/g, '</table>');
        html = html.replace(/<\/h[1-4]><br>/g, (match) => match.replace('<br>', ''));
        html = html.replace(/<br>\s*<ul>/g, '<ul>');
        html = html.replace(/<br>\s*<ol>/g, '<ol>');

        return html;
    }

    // Función para el botón Copiar
    function copyCode(button) {
        const wrapper = button.closest('.code-block-wrapper');
        const codeText = wrapper.querySelector('code').innerText;

        navigator.clipboard.writeText(codeText).then(() => {
            button.textContent = '¡Copiado!';
            setTimeout(() => {
                button.textContent = 'Copiar';
            }, 2000);
        });
    }
</script>
